# Keeps the course dataset (public/data/plat) in step with UCSD's Class Planner.
#
# Every half hour it asks Class Planner whether anything changed
# (scripts/watch-classplanner.mjs): the next quarter's listings, the term's
# course, section or meeting counts, or seats recounted from TSS. Once a day,
# after UCSD's own refresh (about 16:10 UTC), it rebuilds whatever it hears,
# which catches an instructor or a room changing.
#
# A rebuild is published only when it passes scripts/check-data.mjs and the
# test suite, and only when it changed something besides the times its sources
# were read (scripts/data-changed.mjs). Publishing is a commit to main, which
# Vercel deploys. A failure publishes nothing — the site keeps the data it had —
# and an issue labelled "data-update" says what went wrong. Later failures edit
# that issue instead of opening more, and the next good update closes it.

name: Update course data

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "20 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if Class Planner shows no change
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DAILY: ${{ github.event.schedule == '20 17 * * *' }}
    steps:
      - uses: actions/checkout@v4

      # No npm cache here: most runs only ask Class Planner and stop, and
      # restoring one would make every half-hourly check slower.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ask Class Planner what changed
        id: watch
        run: node scripts/watch-classplanner.mjs $([ "$DAILY" = "true" ] && echo --daily)

      # After a failure, wait six hours before rebuilding again: a check that
      # keeps failing would otherwise rebuild every half hour, and each
      # rebuild costs minutes the free plan does not have to spare.
      - name: Decide whether to rebuild
        id: go
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE: ${{ steps.watch.outputs.update }}
          FORCE: ${{ inputs.force }}
          REASON: ${{ steps.watch.outputs.reason }}
        run: |
          echo "$REASON"
          failed=$(gh issue list --label data-update --state open --json updatedAt --jq '.[0].updatedAt // empty' 2>/dev/null || true)
          recent=false
          if [ -n "$failed" ] && [ $(( $(date -u +%s) - $(date -u -d "$failed" +%s) )) -lt 21600 ]; then recent=true; fi
          if [ "$FORCE" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPDATE" = "true" ] && [ "$recent" = "true" ]; then
            echo "An update failed less than six hours ago ($failed); trying again after that."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$UPDATE" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # The catalog and the requirement lists change a few times a year; they
      # are fetched once a week and kept between runs. The grade archive is not
      # fetched: it went behind UCSD's sign-in in October 2026, and the build
      # reads its last open harvest from data/sources/as-grades.json.
      - name: Name this week
        if: steps.go.outputs.run == 'true'
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore this week's catalog and requirement lists
        if: steps.go.outputs.run == 'true'
        id: inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            .data-cache/catalog.json
            .data-cache/requirements.json
          key: inputs-${{ steps.week.outputs.week }}

      - name: Fetch them
        if: steps.go.outputs.run == 'true' && steps.inputs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null
          node scripts/fetch-catalog.mjs
          node scripts/fetch-requirements.mjs

      - name: Keep them for the rest of the week
        if: steps.go.outputs.run == 'true' && steps.inputs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .data-cache/catalog.json
            .data-cache/requirements.json
          key: inputs-${{ steps.week.outputs.week }}

      - name: Fetch the term from Class Planner
        if: steps.go.outputs.run == 'true'
        env:
          TERM_CODE: ${{ steps.watch.outputs.term }}
        run: node scripts/fetch-classplanner.mjs ${TERM_CODE:+--term "$TERM_CODE"}

      - name: Build the dataset
        if: steps.go.outputs.run == 'true'
        run: |
          cp -r public/data/plat "$RUNNER_TEMP/previous"
          node scripts/build-plat-data.mjs

      # The findings also go on the run's summary page, warnings included.
      - name: Check it for errors
        if: steps.go.outputs.run == 'true'
        run: |
          set +e
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-data.mjs --previous "$RUNNER_TEMP/previous" --report "$RUNNER_TEMP/report.md"
          code=$?
          set -e
          if [ -f "$RUNNER_TEMP/report.md" ]; then cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit $code

      - name: Run the tests against it
        if: steps.go.outputs.run == 'true'
        env:
          # Tests that would hold back a new term over a new subject prefix
          # step aside; the checker above warns about it instead.
          DATA_UPDATE: "1"
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: See whether anything changed
        if: steps.go.outputs.run == 'true'
        id: diff
        run: |
          set +e
          node scripts/data-changed.mjs "$RUNNER_TEMP/previous"
          code=$?
          set -e
          if [ $code -eq 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 3 ]; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else exit $code; fi

      # Committed as the site's owner: Vercel deploys a private repository's
      # commits only when its owner wrote them.
      - name: Publish
        if: steps.go.outputs.run == 'true' && steps.diff.outputs.changed == 'true'
        env:
          REASON: ${{ steps.watch.outputs.reason }}
        run: |
          git config user.name "xuwayne262-art"
          git config user.email "244912651+xuwayne262-art@users.noreply.github.com"
          git add public/data/plat
          git commit -q -m "Update course data from UCSD's Class Planner" -m "$REASON" -m "$(cat "$RUNNER_TEMP/report.md")" -m "Automatic update: .github/workflows/update-data.yml"
          git fetch -q origin main
          git rebase -q origin/main
          git push -q origin HEAD:main

      - name: Close the failure issue, if one is open
        if: success() && steps.go.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label data-update --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The automatic update worked again: $RUN_URL"
          done

      - name: Say what went wrong
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ steps.watch.outputs.reason }}
        run: |
          {
            echo "The automatic course-data update failed, so nothing was published: the site still shows the data it had."
            echo
            echo "Why it ran: ${REASON:-it did not get as far as asking Class Planner}"
            echo
            echo "Run, with each step's log: $RUN_URL"
            echo
            if [ -f "$RUNNER_TEMP/report.md" ]; then cat "$RUNNER_TEMP/report.md"; fi
          } > "$RUNNER_TEMP/issue.md"
          gh label create data-update --color B60205 --description "Automatic course-data update" 2>/dev/null || true
          n=$(gh issue list --label data-update --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Automatic course-data update failed" --label data-update --body-file "$RUNNER_TEMP/issue.md"
          fi
